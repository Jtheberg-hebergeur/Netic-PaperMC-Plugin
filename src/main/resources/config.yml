# ════════════════════════════════════════════════════════════
#                NeticAI v1.0-c1-beta - Configuration
# ════════════════════════════════════════════════════════════

api:
  key: "METS_TA_CLE_API_ICI"
  public-enabled: true

ia:
  name: "NETIC"
  trigger: "!ia"
  cooldown-seconds: 3
  system-prompt: |
    Tu es une intelligence artificielle nommée NETIC, utilisée sur un serveur Minecraft.
    Tu parles à plusieurs joueurs en même temps dans une conversation partagée.
    Sois clair, poli, concis et utile.
    Adapte-toi au contexte du jeu Minecraft quand c'est pertinent.
    Tu peux parler de commandes, de mécaniques de jeu, donner des conseils.
    Reste toujours respectueux et bienveillant.
    Réponds de manière naturelle et engageante.

rate-limit:
  player:
    requests-per-minute: 10
  global:
    requests-per-minute: 50

cache:
  enabled: true
  ttl-minutes: 30
  max-size: 1000

history:
  max-messages: 20

database:
  type: "sqlite"

  sqlite:
    file: "netic_history.db"

  mariadb:
    host: "localhost"
    port: 3306
    database: "netic"
    username: "netic_user"
    password: "CHANGE_ME"
    properties:
      cachePrepStmts: true
      prepStmtCacheSize: 250
      prepStmtCacheSqlLimit: 2048
      useServerPrepStmts: true
      useLocalSessionState: true
      rewriteBatchedStatements: true
      cacheResultSetMetadata: true
      cacheServerConfiguration: true
      elideSetAutoCommits: true
      maintainTimeStats: false

  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000